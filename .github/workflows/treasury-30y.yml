name: Update 30Y Treasury auction analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "02_US_Treasury_Auctions/fetch_30y_auctions.py"
      - "02_US_Treasury_Auctions/analyze_30y_auctions.py"
      - "02_US_Treasury_Auctions/fetch_investor_class.py"
      - "02_US_Treasury_Auctions/fetch_cftc_long_bond.py"
      - "02_US_Treasury_Auctions/analyze_cftc_vs_auction.py"
      - ".github/workflows/treasury-30y.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r 02_US_Treasury_Auctions/requirements.txt
      - name: Fetch official Treasury data
        run: python 02_US_Treasury_Auctions/fetch_30y_auctions.py
      - name: Fetch investor class allotments
        run: python 02_US_Treasury_Auctions/fetch_investor_class.py
      - name: Fetch CFTC long Treasury positioning
        run: python 02_US_Treasury_Auctions/fetch_cftc_long_bond.py
      - name: Run exploratory analysis
        run: python 02_US_Treasury_Auctions/analyze_30y_auctions.py
      - name: Compare CFTC positioning with auction investor class
        run: python 02_US_Treasury_Auctions/analyze_cftc_vs_auction.py
      - name: Commit generated data and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 02_US_Treasury_Auctions/data 02_US_Treasury_Auctions/output
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Update 30Y Treasury auction data and analysis"
            # A workflow run may overlap a newer source-code commit on main.
            # Rebase the generated-data commit onto the current remote head
            # before pushing, rather than failing with a non-fast-forward.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
